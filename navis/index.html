<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WHOI BGC Home</title>
  <style>
    :root {
      --blue: #174a70;
      --border: #d7dee4;
      --text: #263746;
      --muted: #687783;
      --background: #f6f8fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--background);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    .page {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 44px 0 60px;
    }

    header {
      padding-bottom: 24px;
      border-bottom: 3px solid var(--blue);
    }

    h1 {
      margin: 0;
      color: var(--blue);
      font-size: 30px;
      font-weight: 600;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    nav {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px 24px;
      margin-top: 30px;
    }

    nav a {
      display: block;
      padding: 14px 16px;
      color: var(--blue);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 3px;
      text-decoration: none;
    }

    nav a:hover,
    nav a:focus-visible {
      background: #eef4f8;
      border-color: #9fb5c5;
      outline: none;
    }

    footer {
      margin-top: 36px;
      padding-top: 16px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .page { padding-top: 28px; }
      nav { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>WHOI BGC Home</h1>
      <p class="subtitle">Biogeochemical float operations and data</p>
    </header>

    <nav aria-label="BGC resources">
      <a href="engineering/index.html">Engineering Data</a>
      <a href="https://argo.whoifloatgroup.org/floats_predeployment">Floats in Lab</a>
      <a href="flow_through/navisindex.html">Navis Flow Through</a>
      <a href="flow_through/BGC_SOLO/index.html">SOLO Flow Through</a>
      <a href="pressure_test/index.html">Navis Pressure Testing</a>
      <a href="pressure_test/BGC_SOLO/index.html">SOLO Pressure Testing</a>
    </nav>

    <footer>WHOI BGC</footer>
  </main>
</body>
</html>
