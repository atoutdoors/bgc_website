<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BGC SOLO Flow Through</title>
  <style>
    :root { --blue: #174a70; --ink: #263746; --muted: #687783; --line: #d7dee4; --bg: #f6f8fa; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--bg); font-family: Arial, Helvetica, sans-serif; font-size: 14px; line-height: 1.45; }
    a { color: var(--blue); text-decoration: none; }
    a:hover, a:focus-visible { color: #0a6c9f; text-decoration: underline; }
    .page { width: min(1050px, calc(100% - 32px)); margin: auto; padding: 28px 0 60px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; padding-bottom: 22px; border-bottom: 3px solid var(--blue); }
    h1 { margin: 0; color: var(--blue); font-size: 28px; font-weight: 600; }
    .subtitle { margin: 4px 0 0; color: var(--muted); }
    .back { white-space: nowrap; font-size: 13px; }
    .layout { display: grid; grid-template-columns: 150px 1fr; gap: 30px; align-items: start; }
    .nav { position: sticky; top: 16px; padding: 16px 0; }
    .nav strong { display: block; margin-bottom: 8px; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .nav a { display: block; padding: 5px 0; font-size: 13px; }
    section { scroll-margin-top: 18px; margin-top: 28px; }
    h2 { margin: 0 0 12px; padding-bottom: 8px; color: var(--blue); border-bottom: 1px solid var(--line); font-size: 21px; font-weight: 600; }
    .date-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 14px; margin: 0; padding: 16px 20px; background: #fff; border: 1px solid var(--line); border-radius: 4px; list-style: none; }
    .date-list a { display: block; padding: 5px 0; }
    footer { margin-top: 42px; padding-top: 16px; color: var(--muted); border-top: 1px solid var(--line); font-size: 12px; }
    @media (max-width: 760px) {
      .page { width: min(100% - 24px, 600px); padding-top: 20px; }
      header { display: block; }
      .back { display: inline-block; margin-top: 12px; }
      .layout { display: block; }
      .nav { position: static; display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 16px 0 4px; border-bottom: 1px solid var(--line); }
      .nav strong { width: 100%; }
    }
    @media (max-width: 430px) { .date-list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div><h1>Flow Through Plots</h1><p class="subtitle">BGC SOLO sensor observations</p></div>
      <a class="back" href="../../index.html">← Back to BGC home</a>
    </header>

    <div class="layout">
      <nav class="nav" aria-label="Plot sections">
        <strong>Sections</strong>
        <a href="#salinity">Salinity</a><a href="#temperature">Temperature</a><a href="#pressure">Pressure</a>
        <a href="#oxygen">Dissolved oxygen</a><a href="#ph">pH</a><a href="#eco">ECO</a>
        <a href="#nitrate">Nitrate</a><a href="#ocr">OCR</a>
      </nav>
      <div id="sections"></div>
    </div>
    <footer>WHOI BGC · SOLO flow-through testing</footer>
  </main>

  <script>
    const dates = ['14-Mar-2025', '20-May-2025', '17-Sep-2025', '01-Oct-2025', '27-Apr-2026'];
    const monthNames = { Jan: 'January', Feb: 'February', Mar: 'March', Apr: 'April', May: 'May', Jun: 'June', Jul: 'July', Aug: 'August', Sep: 'September', Oct: 'October', Nov: 'November', Dec: 'December' };
    const formatDate = date => {
      const [day, month, year] = date.split('-');
      return `${monthNames[month]} ${Number(day)}, ${year}`;
    };
    const sensors = [
      ['salinity', 'Salinity', 'Salinity (PSU)'],
      ['temperature', 'Temperature', 'Temperature (C)'],
      ['pressure', 'Pressure', 'Pressure (dbar)'],
      ['oxygen', 'Dissolved Oxygen', 'DOXY'],
      ['ph', 'pH', 'PH_TOTAL'],
      ['eco', 'Backscattering', 'eco3'],
      ['chlorophyll', 'Chlorophyll a', 'eco2'],
      ['fdom', 'FDOM', 'eco1'],
      ['nitrate', 'Nitrate', 'NO3 (uM)'],
      ['ocr1', 'OCR1', 'ocr1'],
      ['ocr2', 'OCR2', 'ocr2'],
      ['ocr3', 'OCR3', 'ocr3'],
      ['ocr4', 'OCR4', 'ocr4']
    ];
    const root = document.getElementById('sections');
    sensors.forEach(([id, title, file]) => {
      const section = document.createElement('section');
      section.id = id;
      section.innerHTML = `<h2>${title}</h2><ul class="date-list" aria-label="${title} test dates">${dates.map(date => `<li><a href="${date}/${file}.html">${formatDate(date)}</a></li>`).join('')}</ul>`;
      root.appendChild(section);
    });
  </script>
</body>
</html>
