<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Float Diagnostic Plots</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root { --navy: #173f5f; --blue: #20639b; --page: #f7f9fb; --line: #dbe3e9; }
  body { background: var(--page); color: #263746; }
  .site-header { background: #fff; border-top: 5px solid var(--navy); border-bottom: 1px solid var(--line); }
  .site-title { color: var(--navy); letter-spacing: -.02em; }
  .eyebrow { color: var(--blue); font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .table-card { border: 1px solid var(--line); border-radius: .6rem; background: #fff; box-shadow: 0 .2rem .7rem rgba(23,63,95,.05); }
  table { margin-bottom: 0; }
  th { color: var(--navy); background: #edf3f7 !important; }
  td, th { vertical-align: middle; }
  .plot-link { color: var(--blue); text-decoration: none; }
  .plot-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<header class="site-header py-4 mb-4">
  <div class="container">
    <div class="eyebrow mb-1">WHOI BGC</div>
    <h1 class="site-title h2 mb-1">Float Diagnostic Plots</h1>
    <p class="text-secondary mb-0">Vertical velocity and park-pressure plots by float.</p>
  </div>
</header>

<main class="container pb-5">
  <div class="mb-3"><a class="btn btn-sm btn-outline-primary" href="index_bootstrap_polished.html">← Back to Engineering Website</a></div>
  <section aria-labelledby="diagnostic-heading">
    <div class="eyebrow">Float diagnostics</div>
    <h2 id="diagnostic-heading" class="h4 mb-3" style="color:var(--navy)">Select a float</h2>
    <div class="table-card p-2">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead><tr><th scope="col">Float Serial Number</th><th scope="col">Vertical Velocity</th><th scope="col">Park Pressure</th></tr></thead>
          <tbody id="float-plot-rows"><tr><td colspan="3" class="text-secondary">Loading float links...</td></tr></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script>
  fetch('engineeringtable.html')
    .then(response => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.text();
    })
    .then(html => {
      const source = new DOMParser().parseFromString(html, 'text/html');
      const floatLinks = [...source.querySelectorAll('table tbody tr')]
        .map(row => row.cells[0]?.querySelector('a'))
        .filter(link => link && /(?:^|\/)index\.html$/.test(link.getAttribute('href') || ''));
      const rows = document.getElementById('float-plot-rows');
      rows.replaceChildren(...floatLinks.map(floatLink => {
        const row = document.createElement('tr');
        const serial = document.createElement('th');
        serial.scope = 'row';
        serial.textContent = floatLink.textContent.trim();
        row.appendChild(serial);
        const floatIndexUrl = new URL(floatLink.getAttribute('href'), window.location.href);
        [['vertical_velocity_overlay.html', 'View vertical velocity'], ['park_pressure_overlay.html', 'View park pressure']]
          .forEach(([fileName, label]) => {
            const cell = document.createElement('td');
            const link = document.createElement('a');
            link.className = 'plot-link';
            link.href = new URL(fileName, floatIndexUrl).href;
            link.textContent = label;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            cell.appendChild(link);
            row.appendChild(cell);
          });
        return row;
      }));
    })
    .catch(error => {
      document.getElementById('float-plot-rows').innerHTML =
        `<tr><td colspan="3" class="text-danger">Unable to load float links: ${error.message}</td></tr>`;
    });
</script>
</body>
</html>
